<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hierro</title>
<!-- viewport-fit=cover: la app ocupa toda la pantalla y respeta notch / Dynamic Island con safe-area -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Registro de entrenos de gimnasio: rutinas, temporizador, récords y progreso. Sin cuenta y sin conexión.">
<meta name="format-detection" content="telephone=no">
<!-- iOS: abrir a pantalla completa desde la pantalla de inicio -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hierro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

</head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt="Hierro"></div>

<div id="app">
  <main id="pages"></main>

  <button id="miniWorkout" hidden></button>

  <nav id="tabbar" role="tablist" aria-label="Secciones">
    <a class="tab" role="tab" data-tab="entrenar" href="#/entrenar" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Entrenar</a>
    <a class="tab" role="tab" data-tab="historial" href="#/historial" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Historial</a>
    <a class="tab" role="tab" data-tab="progreso" href="#/progreso" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</a>

  </nav>
</div>

<div id="workoutLayer" hidden></div>
<div id="sheetLayer"></div>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;color:#fff">Esta app necesita JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
